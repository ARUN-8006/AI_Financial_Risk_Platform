<!DOCTYPE html>
<html>
<head>
    <title>AI Risk Chatbot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav>
    <h2>FinRisk AI</h2>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/loan">Loan AI</a>
    <a href="/fraud">Fraud AI</a>
    <a href="/credit-score">Credit Score</a>
    <a href="/report">Reports</a>
</nav>

<div class="chat-container">
    <h1>AI Risk Explanation Chatbot</h1>
    <p class="chat-subtitle">Ask: Why was my loan rejected? How is fraud detected?</p>

    <form method="POST" class="chat-form">
        <input type="text" name="question" placeholder="Ask your question..." required>
        <button type="submit">Ask AI</button>
    </form>

    {% if user_question %}
    <div class="chat-box user-msg">
        <strong>You:</strong>
        <p>{{ user_question }}</p>
    </div>
    {% endif %}

    {% if bot_reply %}
    <div class="chat-box bot-msg">
        <strong>AI Bot:</strong>
        <p>{{ bot_reply }}</p>
    </div>
    {% endif %}
</div>

</body>
</html>
